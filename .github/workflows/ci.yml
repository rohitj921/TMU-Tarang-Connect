name: CI Build & Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/TMUTarangConnect/TMUTarangConnect.csproj -r win-x64

      - name: Build project (Release)
        run: dotnet build src/TMUTarangConnect/TMUTarangConnect.csproj -c Release -r win-x64 --no-restore /p:TreatWarningsAsErrors=true

      - name: Publish portable executable smoke-test
        run: >-
          dotnet publish src/TMUTarangConnect/TMUTarangConnect.csproj
          -c Release
          -r win-x64
          --no-restore
          --self-contained false
          -p:PublishSingleFile=true
          -o ./artifacts/portable

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMUTarangConnect-Portable-CI
          path: |
            ./artifacts/portable/TMUTarangConnect.exe
            ./artifacts/portable/app.ico
          retention-days: 7
